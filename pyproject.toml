[project]
name = "freqtrade-v3"
version = "0.1.0"
description = "Auditable crypto strategy research and simulation-only execution infrastructure"
requires-python = ">=3.12,<3.15"
dependencies = [
    "nautilus-trader==1.231.0",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "psycopg[binary]==3.3.5",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "user_data/data",
    "user_data/logs",
    "user_data/backtest_results",
    "user_data/hyperopt_results",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    user_data/data
  | user_data/logs
  | user_data/backtest_results
  | user_data/hyperopt_results
  | \.venv
)/
'''
