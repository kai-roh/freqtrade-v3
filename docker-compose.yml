services:
  freqtrade_v3_shadow:
    image: freqtradeorg/freqtrade@sha256:50720a4af314a812be2cfbf5cc6331c63e9332b06f3f4372241f54bc61a35486
    restart: unless-stopped
    # Reuse the retired V2 container identity so existing host monitoring and
    # the localhost API tunnel continue to work without infrastructure changes.
    container_name: freqtrade_kai
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./configs:/freqtrade/configs:ro"
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - FREQTRADE__API_SERVER__USERNAME=${FREQTRADE_USERNAME}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE_PASSWORD}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${JWT_SECRET}
      - FREQTRADE__EXCHANGE__KEY=${BINANCE_API_KEY}
      - FREQTRADE__EXCHANGE__SECRET=${BINANCE_API_SECRET}
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-v3-shadow.log
      --db-url sqlite:////freqtrade/user_data/tradesv3_v3.sqlite
      --config /freqtrade/configs/dry-run.json
      --strategy ${FREQTRADE_STRATEGY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/ping || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
